name: CI

# A regra do projeto é "verificado por execução, não por leitura". Isto é o que
# faz a regra valer sozinha, em toda mudança, sem depender de alguém lembrar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior da mesma referência: revisar
# resultado de código que já mudou não ajuda ninguém.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, lint, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Acompanha o engines do package.json e o que roda em desenvolvimento.
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Contratos do Core (tipos)
        run: npm run check:core

      # Regras puras de decisão de acesso: rodam no runner do Node, direto
      # sobre o TypeScript. Sem build e sem banco.
      - name: Core — decisão de acesso
        run: npm run test:core

      - name: Landing — tipos, lint e build
        run: npm run validate:site

      - name: SaaS — tipos, lint e build
        run: npm run validate:web

      # Cruza a navegação com as regras de rota: item de menu sem regra
      # declarada cai no padrão e passa a exigir menos do que deveria.
      - name: SaaS — navegação e regras de rota
        run: npm run test:web

      # Sobem um Postgres 18 em WASM (PGlite): sem Docker, sem serviço externo.
      # Aqui mora o teste que não pode falhar em silêncio — o de isolamento
      # entre tenants.
      - name: Banco — esquema, RLS, isolamento e provisionamento
        run: npm run test:db

  # Roda em paralelo: uma falha de formatação não deve esconder uma falha de
  # tipo, e vice-versa.
  format:
    name: Formatação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run format:check
